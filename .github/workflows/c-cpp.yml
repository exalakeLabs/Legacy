name: Cross-platform smoke build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  philsophe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build philsophe (C++17 concurrency demos)
        working-directory: C++/philsophe
        run: make clean all
      - name: Run philosophe (bounded demo)
        working-directory: C++/philsophe
        run: ./philosophe
